<style>/* Layout: una colonna da telefono, barra in alto con mese e calendario, barra di navigazione in basso, schede a comparsa dal basso per modificare. */

.list>button{display:flex;align-items:center;justify-content:space-between;width:100%;text-align:left;background:var(--card);padding:14px;border-radius:12px;box-shadow:var(--shadow);margin-bottom:8px;font-weight:600}

.mm{display:flex;flex-direction:column;justify-content:flex-start;align-items:stretch}

<script>"use strict";
const KP="tn1_",$=id=>document.getElementById(id);

let lastFull=0,tt;
function toast(m){const t=$("toast");if(!t)return;t.textContent=m;t.hidden=false;clearTimeout(tt);tt=setTimeout(()=>{t.hidden=true},4500)}
const LS=(k,d)=>{try{const v=localStorage.getItem(KP+k);return v?JSON.parse(v):d}catch(e){return d}};
const SS=(k,v)=>{try{localStorage.setItem(KP+k,JSON.stringify(v));return true}catch(e){if(Date.now()-lastFull>5000){lastFull=Date.now();toast("Memoria del telefono piena: le modifiche non vengono salvate")}return false}};
const pad=n=>String(n).padStart(2,"0");
const iso=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const DOK=s=>typeof s==="string"&&/^\d{4}-\d{2}-\d{2}$/.test(s);
const pd=s=>{const[y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d,12)};
const addDays=(s,n)=>{const d=pd(s);d.setDate(d.getDate()+n);return iso(d)};
const MESI=["Gennaio","Febbraio","Marzo","Aprile","Maggio","Giugno","Luglio","Agosto","Settembre","Ottobre","Novembre","Dicembre"];
const GG=["Lun","Mar","Mer","Gio","Ven","Sab","Dom"];
const GGL=["Domenica","Lunedì","Martedì","Mercoledì","Giovedì","Venerdì","Sabato"];
const uid=()=>Math.random().toString(36).slice(2,8)+Date.now().toString(36).slice(-4);
const hm=min=>{min=Math.round(min);const h=Math.floor(min/60),m=min%60;return h+"h"+(m?" "+pad(m)+"m":"")};
const str=(x,n)=>typeof x==="string"?x.slice(0,n):"";
const num=(x,lo,hi,d)=>{x=Number(x);return isFinite(x)?Math.min(hi,Math.max(lo,x)):d};
const HEX=/^#[0-9a-fA-F]{6}$/,TIME=/^([01]\d|2[0-3]):[0-5]\d$/;
const ink=c=>{const n=parseInt(c.slice(1),16),r=n>>16,g=n>>8&255,b=n&255;return(r*299+g*587+b*114)/1000>150?"#151a25":"#ffffff"};
const tmin=s=>TIME.test(s)?+s.slice(0,2)*60+ +s.slice(3):null;
const fdate=(s,o)=>pd(s).toLocaleDateString("it-IT",o||{weekday:"short",day:"numeric",month:"short"});

/* ---------- festività italiane ---------- */
function easter(y){const a=y%19,b=Math.floor(y/100),c=y%100,d=Math.floor(b/4),e=b%4,f=Math.floor((b+8)/25),g=Math.floor((b-f+1)/3),h=(19*a+b-d-g+15)%30,i=Math.floor(c/4),k=c%4,l=(32+2*e+2*i-h-k)%7,m=Math.floor((a+11*h+22*l)/451),mo=Math.floor((h+l-7*m+114)/31),da=((h+l-7*m+114)%31)+1;return new Date(y,mo-1,da,12)}
const holC={};
function hols(y){if(holC[y])return holC[y];const o={},add=(m,d,n)=>{o[y+"-"+pad(m)+"-"+pad(d)]=n};add(1,1,"Capodanno");add(1,6,"Epifania");add(4,25,"Festa della Liberazione");add(5,1,"Festa del Lavoro");add(6,2,"Festa della Repubblica");add(8,15,"Ferragosto");add(11,1,"Ognissanti");add(12,8,"Immacolata Concezione");add(12,25,"Natale");add(12,26,"Santo Stefano");const e=easter(y);o[iso(e)]="Pasqua";const l=new Date(e);l.setDate(l.getDate()+1);o[iso(l)]="Lunedì dell’Angelo";return holC[y]=o}

/* ---------- dati e validazione ---------- */
let CALS=[],CUR="",SET={},NOTES=[];
const holName=d=>SET.hol?(hols(+d.slice(0,4))[d]||""):"";
function mkShift(name,code,color,s,e,extra){return Object.assign({id:uid(),name,code,color,s,e,s2:"",e2:"",brk:0,rate:0,fix:0,ot:25,al:{on:false,day:0,t:"07:00"}},extra||{})}
function defCal(){return{id:uid(),name:"Il mio calendario",shifts:[mkShift("Mattina","Ma","#e3a008","06:00","14:00"),mkShift("Pomeriggio","Po","#2f7de1","14:00","22:00"),mkShift("Notte","No","#6b4fd8","22:00","06:00"),mkShift("Riposo","Ri","#2a9d6f","","")],days:{}}}
function cleanShift(s){if(!s||typeof s!=="object")return null;const t=x=>TIME.test(x)?x:"",al=s.al&&typeof s.al==="object"?s.al:{};
 return{id:str(s.id,16).replace(/[^\w-]/g,"")||uid(),name:str(s.name,30)||"Turno",code:str(s.code,3),color:HEX.test(s.color)?s.color:"#2f7de1",s:t(s.s),e:t(s.e),s2:t(s.s2),e2:t(s.e2),brk:Math.round(num(s.brk,0,720,0)),rate:num(s.rate,0,100000,0),fix:num(s.fix,0,1e6,0),ot:num(s.ot,0,500,25),al:{on:!!al.on,day:al.day===1?1:0,t:t(al.t)||"07:00"}}}
function cleanCal(c){if(!c||typeof c!=="object")return null;const shifts=[],ids=new Set();(Array.isArray(c.shifts)?c.shifts:[]).slice(0,40).forEach(x=>{const s=cleanShift(x);if(s&&!ids.has(s.id)){ids.add(s.id);shifts.push(s)}});
 const days={};if(c.days&&typeof c.days==="object"&&!Array.isArray(c.days))Object.keys(c.days).slice(0,8000).forEach(k=>{if(!DOK(k))return;const e=c.days[k];if(!e||typeof e!=="object")return;const o={};if(typeof e.a==="string"&&ids.has(e.a))o.a=e.a;if(typeof e.b==="string"&&ids.has(e.b)&&o.a)o.b=e.b;const x=Math.round(num(e.x,0,1440,0)),l=Math.round(num(e.l,0,1440,0));if(x)o.x=x;if(l)o.l=l;const i=str(e.i,8);if(i)o.i=i;if(Object.keys(o).length)days[k]=o});
 return{id:str(c.id,16).replace(/[^\w-]/g,"")||uid(),name:str(c.name,40)||"Calendario",shifts,days}}
function cleanCals(a){const o=[],ids=new Set();(Array.isArray(a)?a:[]).slice(0,10).forEach(x=>{const c=cleanCal(x);if(c&&!ids.has(c.id)){ids.add(c.id);o.push(c)}});return o}
const IMG=/^data:image\/(jpeg|png|webp);base64,[A-Za-z0-9+\/=]+$/;
function cleanNotes(a){const o=[];(Array.isArray(a)?a:[]).slice(0,2000).forEach(n=>{if(!n||typeof n!=="object"||!DOK(n.d))return;o.push({id:str(n.id,16).replace(/[^\w-]/g,"")||uid(),d:n.d,t:str(n.t,4000),r:TIME.test(n.r)?n.r:"",img:typeof n.img==="string"&&IMG.test(n.img)?n.img:"",dr:typeof n.dr==="string"&&IMG.test(n.dr)?n.dr:""})});return o}
function cleanSet(s){s=s&&typeof s==="object"?s:{};return{wk:s.wk===0?0:1,cur:str(s.cur,3).replace(/[<>&"'`]/g,"")||"€",theme:["auto","light","dark"].includes(s.theme)?s.theme:"auto",hol:s.hol===0?0:1,tone:Math.round(num(s.tone,0,3,0))}}
function initData(){CALS=cleanCals(LS("cals",null));if(!CALS.length)CALS=[defCal()];CUR=LS("cur","");if(!CALS.some(c=>c.id===CUR))CUR=CALS[0].id;SET=cleanSet(LS("set",{}));NOTES=cleanNotes(LS("notes",[]))}
const cal=()=>CALS.find(c=>c.id===CUR)||CALS[0];
const saveC=()=>{SS("cals",CALS);SS("cur",CUR)},saveN=()=>SS("notes",NOTES),saveS=()=>SS("set",SET);
const money=n=>new Intl.NumberFormat("it-IT",{minimumFractionDigits:2,maximumFractionDigits:2}).format(n)+" "+SET.cur;

/* ---------- calcolo ore e guadagni ---------- */
function seg(s,e){const a=tmin(s),b=tmin(e);if(a===null||b===null||a===b)return 0;return b>a?b-a:b+1440-a}
const shiftMin=s=>Math.max(0,seg(s.s,s.e)+seg(s.s2,s.e2)-s.brk);
function dayInfo(c,date){const e=c.days[date];if(!e)return null;const sh=[e.a,e.b].map(id=>id&&c.shifts.find(z=>z.id===id)).filter(Boolean);let min=0,pay=0;sh.forEach(s=>{const m=shiftMin(s);min+=m;pay+=s.fix>0?s.fix:m/60*s.rate});
 const x=e.x||0,l=e.l||0,r=sh[0]?sh[0].rate:0,ot=sh[0]?sh[0].ot:0;min+=x-l;pay+=x/60*r*(1+ot/100)-l/60*r;return{sh,min:Math.max(0,min),pay:Math.max(0,pay),x,l}}
